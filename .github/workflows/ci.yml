name: EcoEvent 360 CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ecoevent-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20.19.0"
  ENVIRONMENT: test
  SECRET_KEY: ci-only-jwt-key-not-for-production-2026
  DATABASE_URL: postgresql+psycopg://ecoevent_ci:ci_password@127.0.0.1:5432/ecoevent_ci
  MIGRATION_DATABASE_URL: postgresql+psycopg://ecoevent_ci:ci_password@127.0.0.1:5432/ecoevent_ci
  RUNTIME_DATABASE_URL: postgresql+psycopg://ecoevent_runtime_ci:runtime_ci_password@127.0.0.1:5432/ecoevent_ci
  REDIS_URL: redis://127.0.0.1:6379/0
  NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
  CI_DATABASE_CONFIRM: ecoevent-test-only

jobs:
  backend-quality:
    name: Backend quality and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Backend static checks, FastAPI, OpenAPI and mappers
        run: bash scripts/ci/backend.sh quick
      - name: Logbook unit tests
        run: bash scripts/ci/backend.sh unit
      - name: Workflow YAML and changed-file whitespace
        run: |
          python scripts/ci/validate-workflow.py
          python scripts/ci/check-whitespace.py

  backend-postgresql:
    name: PostgreSQL migrations and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecoevent_ci
          POSTGRES_USER: ecoevent_ci
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecoevent_ci -d ecoevent_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Initialize isolated PostgreSQL and migrate to head
        run: |
          cd backend && python -m alembic upgrade head
          python scripts/ci/verify_alembic_head.py
          python scripts/ci/verify_security_schema.py
      - name: Create limited runtime role and verify RLS isolation
        run: |
          psql "postgresql://ecoevent_ci:ci_password@127.0.0.1:5432/ecoevent_ci" \
            -v ON_ERROR_STOP=1 -v runtime_role=ecoevent_runtime_ci \
            -v runtime_password=runtime_ci_password \
            -f backend/scripts/configure_runtime_role.sql
          cd backend
          DATABASE_URL="$RUNTIME_DATABASE_URL" python ../scripts/ci/verify_runtime_rls.py
      - name: Logbook PostgreSQL integration tests
        run: python -m pytest -q

  frontend-quality:
    name: Frontend quality and logbook tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript, ESLint and logbook frontend tests
        run: bash scripts/ci/frontend.sh quick

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build Next.js
        run: bash scripts/ci/frontend.sh build
